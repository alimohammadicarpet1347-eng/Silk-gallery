<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>مدیریت کاتالوگ</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f3f6;--ink:#14284b;--mute:#5b6783;--card:#fff;--line:#d9dde7;--acc:#9c2a3a}
@media(prefers-color-scheme:dark){:root{--bg:#0e1730;--ink:#eef0f6;--mute:#a4adc4;--card:#16224a;--line:#2a3763;--acc:#e07a8a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8;padding:20px}
.w{max-width:640px;margin:auto}
h1{font-size:24px;margin:0 0 4px}h2{font-size:18px;margin:28px 0 10px}
p{color:var(--mute);margin:4px 0 14px;font-size:14px}
form,.row{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px}
label{display:block;font-size:14px;margin:10px 0 2px}
input,select,textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
button,.btn{font:inherit;padding:10px 18px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;margin-top:14px}
button.s{background:transparent;color:var(--ink)}
button.d{background:transparent;color:var(--acc);border-color:var(--acc);margin:0}
.row{display:flex;gap:12px;align-items:center;margin-bottom:10px;padding:10px}
.row img{width:56px;height:70px;object-fit:cover;border-radius:4px}
.row div{flex:1}.row small{color:var(--mute)}
#msg{color:var(--acc);min-height:24px;font-size:14px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div class="w">
<h1>مدیریت کاتالوگ</h1>
<p>این صفحه فقط برای شماست. لینکی به آن از سایت داده نشده است.</p>
<form id="f">
<label for="n">نام اثر</label><input id="n" required>
<label for="c">دسته</label><select id="c"><option>تابلوفرش</option><option>فرش</option></select>
<label for="z">ابعاد (اختیاری)</label><input id="z" placeholder="مثلاً ۱۲ متری یا ۷۰×۵۰">
<label for="d">توضیح کوتاه (اختیاری)</label><textarea id="d" rows="2"></textarea>
<label for="p">عکس اثر</label><input id="p" type="file" accept="image/*" required>
<button type="submit">افزودن به کاتالوگ</button>
</form>
<div id="msg" role="status"></div>
<h2>آثار ثبت‌شده (<span id="k">0</span>)</h2>
<div id="l"></div>
<h2>انتشار روی سایت</h2>
<p>بعد از افزودن آثار، فایل را دانلود کنید و در Netlify کنار index.html قرار دهید (جایگزین products.json قبلی).</p>
<button id="x">دانلود products.json</button>
<button id="i" class="s">وارد کردن products.json قبلی</button>
<input id="im" type="file" accept=".json" hidden>
</div>
<script>
var KEY='alimohamadi_products',items=[];
try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}
var $=function(i){return document.getElementById(i)};
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){$('msg').textContent='حافظه مرورگر پر است. ابتدا فایل را دانلود کنید و آثار قدیمی را پاک کنید.'}draw()}
function draw(){
  $('k').textContent=items.length;
  $('l').innerHTML=items.map(function(p,i){
    return '<div class="row"><img src="'+p.image+'" alt=""><div>'+p.name.replace(/</g,'&lt;')+'<br><small>'+p.category+'</small></div><button class="d" data-i="'+i+'">حذف</button></div>';
  }).join('')||'<p>هنوز اثری اضافه نشده است.</p>';
}
$('l').onclick=function(e){var b=e.target.closest('button');if(!b)return;
  if(confirm('این اثر حذف شود؟')){items.splice(+b.dataset.i,1);save()}};
function shrink(file){return new Promise(function(res,rej){
  var r=new FileReader();r.onerror=rej;
  r.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){
    var m=900,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg',.75))};im.src=r.result};
  r.readAsDataURL(file)})}
$('f').onsubmit=function(e){e.preventDefault();
  shrink($('p').files[0]).then(function(img){
    items.unshift({name:$('n').value.trim(),category:$('c').value,size:$('z').value.trim(),desc:$('d').value.trim(),image:img});
    save();$('f').reset();$('msg').textContent='اثر اضافه شد.';
  }).catch(function(){$('msg').textContent='عکس خوانده نشد. عکس دیگری انتخاب کنید.'})};
$('x').onclick=function(){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(items)],{type:'application/json'}));
  a.download='products.json';a.click()};
$('i').onclick=function(){$('im').click()};
$('im').onchange=function(){var r=new FileReader();r.onload=function(){
  try{var d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;items=d;save();$('msg').textContent='فایل وارد شد.'}
  catch(e){$('msg').textContent='فایل معتبر نیست.'}};r.readAsText(this.files[0])};
draw();
</script>
</body>
</html>
